name: Backend CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the complete offline Backend suite
        type: boolean
        default: true
  workflow_call:
    inputs:
      test_ref:
        type: string
        default: ''
      full_regression:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-job:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_regression && 60 || 10 }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sayfridge_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sayfridge_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      AGENT_LIVE_MODEL: '0'
      TEST_DATABASE_URL: postgresql+psycopg://test_user:ci-only-password@localhost:5432/sayfridge_auth_test
      AGENT_CLIENT_CAPTURE_FILE: agent-client-traces.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Core regression (pull requests and main)
        if: ${{ !inputs.full_regression }}
        run: python -m pytest -v -m ci --strict-markers --durations=15 --junitxml=test-results.xml
      - name: Full regression (manual)
        if: inputs.full_regression
        run: python -m pytest -v --strict-markers --junitxml=test-results.xml
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7
      - name: Actual backend responses for unchanged clients
        uses: actions/upload-artifact@v4
        with:
          name: agent-client-traces
          path: backend/agent-client-traces.jsonl
          retention-days: 7

  legacy-agent-clients:
    name: Unchanged Agent clients consume backend responses
    needs: test-job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_CLIENT_CAPTURE_FILE: ../backend/agent-client-traces.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: agent-client-traces
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Locked Web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Existing Web parser and chat state
        working-directory: web
        run: npm test -- --config ../backend/tests/vitest.agent-clients.config.mts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Locked Mobile dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Existing Mobile parser and retry controller
        working-directory: mobile
        run: flutter test --no-pub ../backend/tests/agent_client_compat_test.dart
