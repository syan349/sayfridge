name: Browser E2E
on:
  workflow_call:
    inputs:
      test_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: ci-only-e2e-password
          POSTGRES_DB: sayfridge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_user -d sayfridge_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql+psycopg://e2e_user:ci-only-e2e-password@127.0.0.1:5432/sayfridge_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: E2E database safety guards
        run: python -m pytest tests/test_e2e_runner.py -q
        working-directory: backend
      - name: Isolated browser, API and database test
        run: python backend/scripts/run_e2e.py
      - name: E2E reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-e2e-results
          path: web/.e2e-artifacts/
          include-hidden-files: true
          retention-days: 7
